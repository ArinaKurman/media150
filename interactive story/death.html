<!DOCTYPE html>
<html>
<head>
<title>Death</title>

<style>
body {
    margin: 0;
    background-color: black;
    color: white;
    font-family: Georgia, serif;
    text-align: center;
}


.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}


.monster {
    width: 350px;
    opacity: 0;
    animation: fadeIn 3s forwards;
    animation-delay: 2s;
}

h1 {
    color: red;
    letter-spacing: 5px;
    opacity: 0;
    animation: fadeIn 2s forwards;
    animation-delay: 5s;
}

.line {
    opacity: 0;
    animation: fadeIn 2s forwards;
}

.line1 { animation-delay: 7s; }
.line2 { animation-delay: 9s; }


.btn {
    margin-top: 30px;
    display: inline-block;
    padding: 10px 25px;
    border: 1px solid white;
    color: white;
    text-decoration: none;
    opacity: 0;
    animation: fadeIn 2s forwards;
    animation-delay: 11s;
}

.btn:hover {
    background: white;
    color: black;
}

@keyframes fadeIn {
    to {
        opacity: 1;
    }
}
</style>

</head>

<body>

<div class="container">


    <img src="monster.jpg" class="monster">

    <h1>YOU CHOSE WRONG</h1>

    <p class="line line1">Now… it sees you.</p>
    <p class="line line2">...dead</p>

    <br>

    <a href="story.html" class="btn">TRY AGAIN</a>
    <a href="index.html" class="btn">HOME</a>

</div>

</body>
</html>
