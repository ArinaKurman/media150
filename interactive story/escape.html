 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Escape</title>

<style>
body {
    margin: 0;
    background-color: black;
    color: white;
    font-family: Georgia, serif;
    text-align: center;
    overflow: hidden;
}

/* background image */
.bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("orangedoor.jpg") no-repeat center/cover;
    filter: brightness(0.5);
    z-index: -1;
}

/* text container */
.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

/* text animation */
.line {
    opacity: 0;
    animation: fadeIn 2s forwards;
}

.line:nth-child(1) { animation-delay: 1s; }
.line:nth-child(2) { animation-delay: 3s; }
.line:nth-child(3) { animation-delay: 5s; }

@keyframes fadeIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* button */
.btn {
    margin-top: 40px;
    display: inline-block;
    padding: 12px 30px;
    border: 1px solid white;
    text-decoration: none;
    color: white;
    opacity: 0;
    animation: fadeIn 2s forwards;
    animation-delay: 7s;
}

.btn:hover {
    background: white;
    color: black;
}

/* home button */
.home {
    position: absolute;
    bottom: 30px;
    width: 100%;
    text-align: center;
}

.home a {
    color: gray;
    text-decoration: none;
}
</style>

</head>

<body>

<div class="bg"></div>

<div class="container">
    <h1 class="line">YOU ESCAPED</h1>

    <p class="line">The orange door opens slowly…</p>

    <p class="line">
        Fresh air hits your face.  
        Whatever was inside… stays behind.
    </p>

    <a href="interactivestory.html" class="btn">PLAY AGAIN</a>
</div>

<div class="home">
    <a href="../index.html">Home</a>
</div>

</body>
</html>
