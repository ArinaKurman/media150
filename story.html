 <!DOCTYPE html>
<html>
<head>
  <title>The First Choice</title>

  <style>
    body {
      background-color: #0b0b0f;
      color: #e8e0d6;
      font-family: Georgia, serif;
      text-align: center;
      padding-top: 110px;
      margin: 0;
    }

    h1 {
      color: #8b1e1e;
      letter-spacing: 6px;
      font-size: 42px;
    }

    .story {
      max-width: 700px;
      margin: 40px auto;
      font-size: 20px;
      line-height: 1.6;
      opacity: 0;
      animation: fadeIn 2s forwards;
    }

    .choices {
      margin-top: 50px;
      opacity: 0;
      animation: fadeIn 2s forwards;
      animation-delay: 2.5s;
    }

    a {
      display: inline-block;
      margin: 15px;
      padding: 15px 28px;
      border: 1px solid #8b1e1e;
      color: #e8e0d6;
      text-decoration: none;
      font-size: 16px;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    a:hover {
      background-color: #8b1e1e;
      color: white;
      transform: scale(1.05);
    }

    .home {
      margin-top: 50px;
      font-size: 14px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <h1>THE ALARM</h1>

  <div class="story">
    The emergency lights flash red across the empty hallway.<br><br>
    A voice comes from the speaker:<br>
    “Containment breach detected.”<br><br>
    You hear something moving behind the lab doors.<br>
    You need to decide fast.
  </div>

  <div class="choices">
    <a href="control.html">Go to the control panel</a>
    <a href="exit.html">Follow the exit sign</a>
  </div>

  <div class="home">
    <a href="../index.html">HOME</a>
  </div>

</body>
</html>
